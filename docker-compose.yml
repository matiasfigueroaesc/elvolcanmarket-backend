# El Volcán Market — MySQL para el perfil "mysql" (opcional).
# Sin Docker también funciona: el perfil por defecto es H2 y no necesita nada instalado.
# Uso: copiar .env.example a .env y ejecutar `docker compose up -d`.

services:
  mysql:
    image: mysql:8.4
    container_name: volcan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Lo usa el script de init para crear volcan_usuarios, volcan_catalogo, etc.
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
      TZ: America/Santiago
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Los scripts de esta carpeta corren solo la PRIMERA vez (volumen vacío).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
