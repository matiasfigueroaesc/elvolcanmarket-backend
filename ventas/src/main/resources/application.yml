server:
  port: ${PORT:8083}

spring:
  application:
    name: ventas
  profiles:
    # h2 = base de archivo, no necesita instalar nada. Para MySQL: --spring.profiles.active=mysql
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  issuer: ${JWT_ISSUER:elvolcan-usuarios}
  jwks: ${AUTH_JWKS_URL:http://localhost:8081/api/v1/auth/jwks}
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  # Para descontar stock: POST {catalogo-url}/internal/v1/ventas/{boletaId} con X-Internal-Key
  catalogo-url: ${CATALOGO_URL:http://localhost:8082}
  # Para crear el despacho al confirmar el pago: POST {despacho-url}/internal/v1/despachos
  despacho-url: ${DESPACHO_URL:http://localhost:8084}
  # Misma clave interna para catálogo y despacho (X-Internal-Key)
  internal-key: ${INTERNAL_API_KEY:local-cambiar-clave-interna-32-caracteres}
  # Cada cuánto se reintenta avisar a despacho las boletas pagadas que no alcanzó a registrar
  reintento-despacho-ms: ${REINTENTO_DESPACHO_MS:60000}
